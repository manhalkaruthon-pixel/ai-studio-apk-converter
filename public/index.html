<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Studio ZIP → APK</title>
<style>
:root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0%,#f0f0f0 0,transparent 52%),#fafafa;color:#101010}.wrap{width:min(520px,calc(100vw - 32px));margin:7vh auto 40px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-size:14px;font-weight:700;letter-spacing:-.3px}.muted{font-size:12px;color:#777}.card{padding:22px;border:1px solid rgba(0,0,0,.09);border-radius:24px;background:rgba(255,255,255,.84);box-shadow:0 24px 80px rgba(0,0,0,.07),inset 0 1px 0 #fff;backdrop-filter:blur(22px);margin-bottom:14px}.card h1{font-size:20px;letter-spacing:-.6px;margin:0 0 6px}.sub{font-size:13px;color:#777;margin:0 0 20px}.field{width:100%;height:46px;border:1px solid #ddd;border-radius:12px;padding:0 13px;font:inherit;font-size:14px;margin:6px 0 10px;background:#fff}.primary,.secondary{height:46px;border:0;border-radius:12px;padding:0 16px;font-size:13px;font-weight:650;cursor:pointer}.primary{width:100%;background:#111;color:#fff}.primary:hover{background:#303030}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#eee;color:#111}.linkbtn{border:0;background:none;color:#555;font-size:12px;text-decoration:underline;cursor:pointer;padding:10px 0 0}.authnote{font-size:12px;color:#777;margin-top:12px}.drop{height:174px;border:1px dashed #b9b9b9;border-radius:17px;display:grid;place-items:center;text-align:center;cursor:pointer;transition:.18s;background:rgba(248,248,248,.8);outline:none}.drop:hover,.drop.over{border-color:#111;background:#f1f1f1}.drop svg{width:30px;height:30px;margin-bottom:10px}.filename{font-size:12px;color:#555;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:7px}.status{min-height:18px;margin:12px 2px 0;font-size:12px;color:#666;text-align:center;overflow-wrap:anywhere}.status.error{color:#b42318}.download{display:none;margin-top:12px}.download a{display:block;padding:14px;border-radius:12px;background:#ededed;color:#111;text-align:center;text-decoration:none;font-size:13px;font-weight:650}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sectionhead h2{font-size:14px;margin:0}.job{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #eee}.jobname{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:270px}.jobmeta{font-size:11px;color:#888;margin-top:4px}.pill{font-size:10px;border-radius:20px;background:#eee;padding:5px 8px;color:#555;white-space:nowrap}.pill.completed{background:#e6f4ea;color:#176b35}.pill.failed{background:#fce8e6;color:#b42318}input[type=file]{display:none}#app{display:none}
</style>
</head>
<body><main class="wrap">
<div class="top"><div class="brand">AI STUDIO <span class="muted">/ APK CONVERTER</span></div><button class="secondary" id="signout" style="display:none">Sign out</button></div>
<section class="card" id="auth">
<h1 id="authTitle">Sign in</h1><p class="sub">Use your account to access the converter.</p>
<form id="authForm"><input class="field" id="email" type="email" placeholder="Email address" autocomplete="email" required><input class="field" id="password" type="password" placeholder="Password" autocomplete="current-password" minlength="8" required><button class="primary" id="authSubmit">Sign in</button></form>
<button class="linkbtn" id="toggleAuth">Create an account</button><div class="status" id="authStatus" aria-live="polite"></div>
<div class="authnote">Account access is managed securely through Supabase Auth.</div>
</section>
<div id="app">
<section class="card"><h1>Convert a project</h1><p class="sub">Upload the ZIP exported from Google AI Studio.</p>
<div class="drop" id="drop" role="button" tabindex="0" aria-label="Choose ZIP file"><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 15.5v3A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5v-3"/></svg><div id="label">Drop ZIP file here</div><div class="filename" id="filename"></div></div></div>
<input id="file" type="file" accept=".zip,application/zip"><button class="primary" id="convert" disabled style="margin-top:14px">Convert to APK</button><div class="status" id="status" aria-live="polite"></div><div class="download" id="download"><a id="downloadLink" href="#" target="_blank" rel="noopener">Download APK</a></div>
</section>
<section class="card"><div class="sectionhead"><h2>Recent conversions</h2><button class="linkbtn" id="refresh" style="padding:0">Refresh</button></div><div id="jobs"><div class="muted">No conversions yet.</div></div></section>
</div></main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://belrtispyjbluqoaynbn.supabase.co';
const SUPABASE_KEY='sb_publishable_qdZ1Uj5O7pCqp2QnesBa2A_qE-lYfSl';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);let selected=null,signup=false,session=null;
function authMessage(message,error=false){$('#authStatus').textContent=message;$('#authStatus').className='status'+(error?' error':'')}
function appMessage(message,error=false){$('#status').textContent=message;$('#status').className='status'+(error?' error':'')}
function showApp(value){$('#auth').style.display=value?'none':'block';$('#app').style.display=value?'block':'none';$('#signout').style.display=value?'block':'none'}
async function getToken(){const {data}=await supabase.auth.getSession();session=data.session;return session?.access_token}
async function api(path,options={}){const token=await getToken();if(!token)throw new Error('Sign in to continue.');const response=await fetch(path,{...options,headers:{...(options.headers||{}),Authorization:`Bearer ${token}`}});const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||'Request failed.');return body}
async function refreshJobs(){try{const {jobs}=await api('/api/jobs');const host=$('#jobs');if(!jobs.length){host.innerHTML='<div class="muted">No conversions yet.</div>';return}host.innerHTML=jobs.map(j=>`<div class="job"><div style="min-width:0"><div class="jobname" title="${escapeHtml(j.original_filename)}">${escapeHtml(j.original_filename)}</div><div class="jobmeta">${new Date(j.created_at).toLocaleString()}</div></div><span class="pill ${j.status}">${j.status}</span></div>`).join('')}catch(e){$('#jobs').textContent=e.message}}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function syncSession(){const {data}=await supabase.auth.getSession();session=data.session;showApp(!!session);if(session)await refreshJobs()}
$('#authForm').addEventListener('submit',async e=>{e.preventDefault();$('#authSubmit').disabled=true;authMessage(signup?'Creating account…':'Signing in…');try{const email=$('#email').value.trim(),password=$('#password').value;if(signup){const {data,error}=await supabase.auth.signUp({email,password});if(error)throw error;if(!data.session)authMessage('Account created. Check your email to confirm, then sign in.');else{authMessage('Account created.');await syncSession()}}else{const {error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;authMessage('');await syncSession()}}catch(e){authMessage(e.message,true)}finally{$('#authSubmit').disabled=false}});
$('#toggleAuth').addEventListener('click',()=>{signup=!signup;$('#authTitle').textContent=signup?'Create account':'Sign in';$('#authSubmit').textContent=signup?'Create account':'Sign in';$('#toggleAuth').textContent=signup?'Already have an account? Sign in':'Create an account';$('#password').autocomplete=signup?'new-password':'current-password';authMessage('')});
$('#signout').addEventListener('click',async()=>{await supabase.auth.signOut();selected=null;$('#filename').textContent='';$('#convert').disabled=true;showApp(false)});
supabase.auth.onAuthStateChange((_event,newSession)=>{session=newSession;showApp(!!session);if(session)refreshJobs()});
const drop=$('#drop'),fileInput=$('#file'),convert=$('#convert'),filename=$('#filename'),download=$('#download'),link=$('#downloadLink');
function choose(file){if(!file)return;if(!file.name.toLowerCase().endsWith('.zip')){appMessage('Please select a ZIP file.',true);return}selected=file;filename.textContent=file.name;convert.disabled=false;appMessage('');download.style.display='none'}
drop.addEventListener('click',()=>fileInput.click());drop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fileInput.click()}});fileInput.addEventListener('change',e=>choose(e.target.files[0]));for(const ev of ['dragenter','dragover'])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')});for(const ev of ['dragleave','drop'])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')});drop.addEventListener('drop',e=>choose(e.dataTransfer.files[0]));
convert.addEventListener('click',async()=>{if(!selected)return;convert.disabled=true;appMessage('Building Android APK. This may take several minutes…');download.style.display='none';const data=new FormData();data.append('file',selected);try{const result=await api('/api/convert',{method:'POST',body:data});link.href=result.downloadUrl;link.download=(selected.name.replace(/\.zip$/i,'')||'app')+'.apk';download.style.display='block';appMessage('Build completed. Your APK is ready.');await refreshJobs()}catch(e){appMessage(e.message,true);await refreshJobs()}finally{convert.disabled=!selected}});
$('#refresh').addEventListener('click',refreshJobs);
await syncSession();
</script></body></html>
